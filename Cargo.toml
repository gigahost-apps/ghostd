[workspace]
resolver = "3"
members = ["crates/ghostd-protocol", "crates/ghostd-client", "crates/ghostd"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
repository = "https://github.com/gigahost-apps/ghostd"

[workspace.dependencies]
ghostd-protocol = { path = "crates/ghostd-protocol", version = "0.1.0" }
ghostd-client = { path = "crates/ghostd-client", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
