[package]
name = "ghostd"
description = "A daemon on a Linux machine for AI agents to work on it, reached over SSH"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "ghostd"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.7", features = ["derive"] }
ghostd-protocol.workspace = true
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
memchr = "2"
nix = { version = "0.30.1", features = ["process", "signal", "fs", "user"] }
regex = "1.12"
rustix = { version = "1.1.5", features = ["fs", "net", "process", "pty", "stdio", "system", "termios"] }
serde.workspace = true
serde_json = "1.0.151"
sha2 = "0.10.9"
signal-hook = "0.3.18"
tokio.workspace = true
toml = "1.1.6"
vt100 = "0.16.2"

[dev-dependencies]
ghostd-client.workspace = true
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"

[lints]
workspace = true
