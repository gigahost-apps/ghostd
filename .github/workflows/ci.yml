name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: sshd for the SSH test
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: SSH test
        run: cargo test -p ghostd --test ssh -- --ignored

  # The binary every install path ships: static, for musl, on both
  # architectures, and the tests run against it.
  musl:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: rustup when the image has none
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL --proto '=https' --tlsv1.2 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Toolchain and the musl target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$(uname -m)-unknown-linux-musl"
      - name: Static release build
        run: cargo build --release --locked -p ghostd --target "$(uname -m)-unknown-linux-musl"
      - name: Statically linked
        run: |
          bin="target/$(uname -m)-unknown-linux-musl/release/ghostd"
          file "$bin"
          file "$bin" | grep -Eq 'static(ally|-pie) linked'
          "$bin" --version
      - name: Tests on musl
        run: cargo test --workspace --target "$(uname -m)-unknown-linux-musl"

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Syntax
        run: sh -n install.sh
      - name: Shellcheck
        run: shellcheck install.sh

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-fuzz --locked
      - name: Fuzz the frame decoders for a minute
        run: cargo +nightly fuzz run frames -- -max_total_time=60
